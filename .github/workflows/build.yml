# SPDX-License-Identifier: Apache-2.0
name: Build

on:
  push:
    branches: [ main, feat/*, feature/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# The checks that do not depend on the operating system and LLVM version, which the LLVM
# versions workflow covers one combination per job.
jobs:
  # Computed once per run, from the Conventional Commits since the last tag.
  semver:
    name: Compute next version (SemVer)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Compute next version (SemVer)
      run: python3 scripts/ci/semver_check.py

  # The Docker test image builds and tests the project on amd64 and arm64 (under QEMU).
  docker:
    name: Docker tests (multi-arch, Linux)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Docker tests (multi-arch)
      run: |
        docker buildx build --platform linux/amd64 -f test/docker/Dockerfile . --progress=plain --output=type=cacheonly
        docker buildx build --platform linux/arm64 -f test/docker/Dockerfile . --progress=plain --output=type=cacheonly

  # Consumers that only embed compilerlib build it without the instrumentation runtime
  # (CORETRACE_COMPILER_BUILD_RUNTIME=OFF): no coretrace-log fetch, and --instrument
  # takes a runtime built elsewhere through CT_RUNTIME_LIB_DIR.
  build-without-runtime:
    name: Build without the runtime (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake
        sudo bash scripts/ci/install-llvm-apt.sh 20 llvm-20 llvm-20-dev clang-20 libclang-20-dev

    - name: Build and check without the runtime
      run: |
        bash scripts/ci/check-build-without-runtime.sh "${RUNNER_TEMP}/no-runtime" \
          -DCMAKE_BUILD_TYPE=Release \
          -DLLVM_DIR=/usr/lib/llvm-20/lib/cmake/llvm \
          -DClang_DIR=/usr/lib/llvm-20/lib/cmake/clang \
          -DUSE_SHARED_LIB=OFF

  # install-llvm-apt.sh must recover from an apt.llvm.org outage, which the other jobs
  # only meet by chance: stubs replay one, in the Ubuntu 22.04 image, which lacks gpg.
  check-install-llvm-apt:
    name: Check install-llvm-apt.sh retries
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Replay an apt.llvm.org outage
      run: |
        docker run --rm -v "${PWD}:/src:ro" ubuntu:22.04 \
          bash /src/scripts/ci/check-install-llvm-apt.sh

  # compilerlib, cc and the tests built with AddressSanitizer and LeakSanitizer
  # (ENABLE_DEBUG_ASAN), and with UndefinedBehaviorSanitizer (ENABLE_DEBUG_UBSAN). The
  # runtime and its logger are built without them, since instrumented programs link them
  # without the sanitizers' runtimes.
  build-asan:
    name: Build with AddressSanitizer and UBSan (ubuntu-24.04)
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build python3-venv
        sudo bash scripts/ci/install-llvm-apt.sh 20 llvm-20 llvm-20-dev clang-20 libclang-20-dev \
          libclang-rt-20-dev

    - name: Build
      run: |
        cmake -S . -B build -G Ninja -DENABLE_DEBUG_ASAN=ON -DENABLE_DEBUG_UBSAN=ON \
          -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
          -DLLVM_DIR=/usr/lib/llvm-20/lib/cmake/llvm \
          -DClang_DIR=/usr/lib/llvm-20/lib/cmake/clang \
          -DUSE_SHARED_LIB=OFF
        cmake --build build

    - name: Run unit tests
      run: ctest --test-dir build --output-on-failure

    - name: Run Python smoke tests
      run: |
        python3 -m venv .venv
        source .venv/bin/activate
        python -m pip install --upgrade pip
        python -m pip install git+https://github.com/CoreTrace/coretrace-testkit.git
        python test/examples/test_smoke.py
        python test/examples/test_extern_project.py
        python test/examples/test_help_smoke.py

    - name: Run runtime fixture suites
      run: |
        bash test/run_autofree_tests.sh "${RUNNER_TEMP}/ct_autofree_tests"
        bash test/run_runtime_tests.sh "${RUNNER_TEMP}/ct_runtime_tests"
        bash test/run_differential_tests.sh "${RUNNER_TEMP}/ct_differential_tests"

  # Line coverage of compilerlib, cc and the runtime (ENABLE_COVERAGE), from the unit tests,
  # the smoke tests and the runtime fixture suites. Informational: no threshold is enforced.
  # The suites build their programs with -fprofile-instr-generate, so that the runtime they
  # link records its coverage.
  coverage:
    name: Coverage (ubuntu-24.04, LLVM 20)
    runs-on: ubuntu-24.04
    env:
      LLVM_PROFILE_FILE: ${{ github.workspace }}/profiles/%8m.profraw

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build python3-venv
        sudo bash scripts/ci/install-llvm-apt.sh 20 llvm-20 llvm-20-dev clang-20 libclang-20-dev \
          libclang-rt-20-dev

    - name: Build
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON \
          -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
          -DLLVM_DIR=/usr/lib/llvm-20/lib/cmake/llvm \
          -DClang_DIR=/usr/lib/llvm-20/lib/cmake/clang \
          -DUSE_SHARED_LIB=OFF
        cmake --build build

    - name: Run unit tests
      run: ctest --test-dir build --output-on-failure

    - name: Run Python smoke tests
      run: |
        python3 -m venv .venv
        source .venv/bin/activate
        python -m pip install --upgrade pip
        python -m pip install git+https://github.com/CoreTrace/coretrace-testkit.git
        python test/examples/test_smoke.py
        python test/examples/test_extern_project.py
        python test/examples/test_help_smoke.py

    - name: Run runtime fixture suites
      env:
        CT_TEST_OPT: -fprofile-instr-generate
      run: |
        bash test/run_autofree_tests.sh "${RUNNER_TEMP}/ct_autofree_tests"
        bash test/run_runtime_tests.sh "${RUNNER_TEMP}/ct_runtime_tests"
        bash test/run_differential_tests.sh "${RUNNER_TEMP}/ct_differential_tests"

    - name: Coverage report
      if: ${{ !cancelled() }}
      run: |
        llvm-profdata-20 merge -sparse profiles/*.profraw -o coverage.profdata
        objects=(build/cc -object build/test/unit/compilerlib_unit_tests
                 -object build/test/unit/runtime_unit_tests
                 -object build/libct_instrument_runtime.a)
        filter='(_deps|/test/|^/usr/)'
        llvm-cov-20 report "${objects[@]}" -instr-profile coverage.profdata \
          -ignore-filename-regex="${filter}" | sed "s|${GITHUB_WORKSPACE}/||" > coverage.txt
        llvm-cov-20 show "${objects[@]}" -instr-profile coverage.profdata \
          -ignore-filename-regex="${filter}" -format=html -output-dir coverage-html
        cat coverage.txt
        {
          echo '### Line coverage (LLVM 20, Linux)'
          echo '```'
          cat coverage.txt
          echo '```'
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Upload the coverage report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html
        path: |
          coverage-html
          coverage.txt
